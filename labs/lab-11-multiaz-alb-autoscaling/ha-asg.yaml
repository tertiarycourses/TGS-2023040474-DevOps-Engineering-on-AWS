AWSTemplateFormatVersion: '2010-09-09'
Description: Lab 11 - Multi-AZ Application Load Balancer + Auto Scaling group (high availability).
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which to deploy the HA web tier.
  SubnetAId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in Availability Zone A.
  SubnetBId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in Availability Zone B.
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.micro
Resources:
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP to the load balancer.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
  InstanceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP only from the load balancer.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSg
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: devops-ha-lt
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        ImageId: !Ref LatestAmi
        SecurityGroupIds: [ !Ref InstanceSg ]
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: devops-ha-web }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            dnf install -y httpd
            echo "OK from $(hostname)" > /var/www/html/index.html
            systemctl enable --now httpd
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: devops-ha-alb
      Type: application
      Scheme: internet-facing
      SecurityGroups: [ !Ref AlbSg ]
      Subnets: [ !Ref SubnetAId, !Ref SubnetBId ]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: devops-ha-tg
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  Asg:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: devops-ha-asg
      MinSize: '2'
      MaxSize: '6'
      DesiredCapacity: '2'
      HealthCheckType: ELB
      HealthCheckGracePeriod: 60
      VPCZoneIdentifier: [ !Ref SubnetAId, !Ref SubnetBId ]
      TargetGroupARNs: [ !Ref TargetGroup ]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
Outputs:
  AlbDnsName:
    Description: Public DNS name of the load balancer.
    Value: !GetAtt Alb.DNSName
  AsgName:
    Value: !Ref Asg
  TargetGroupArn:
    Value: !Ref TargetGroup
