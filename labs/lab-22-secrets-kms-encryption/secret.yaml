AWSTemplateFormatVersion: '2010-09-09'
Description: Lab 22 - enable 30-day automatic rotation on the app secret.
Parameters:
  SecretArn:
    Type: String
    Description: ARN of the devops/app/db secret created via the CLI
  RotationLambdaArn:
    Type: String
    Description: ARN of a Secrets Manager rotation Lambda (from the AWS rotation templates)
Resources:
  AppSecretRotation:
    Type: AWS::SecretsManager::RotationSchedule
    Properties:
      SecretId: !Ref SecretArn
      RotationLambdaARN: !Ref RotationLambdaArn
      RotationRules:
        AutomaticallyAfterDays: 30
